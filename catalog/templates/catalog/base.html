<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}IT Course Portal{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
   rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold" href="{% url 'catalog:home' %}">
               DTI CoursePortal
</a>
<div class="navbar-collapse">
<ul class="navbar-nav ms-auto">
<li class="nav-item">
<a class="nav-link" href="{% url 'catalog:home' %}">Home</a>
</li>
<li class="nav-item">
<a class="nav-link" href="{% url 'catalog:course_list' %}">Courses</a>
</li>
<li class="nav-item">
<a class="nav-link" href="{% url 'catalog:inquiry' %}">Submit Inquiry</a>
</li>
</ul>
</div>
</div>
</nav>
<main class="container my-4 flex-grow-1">
       {% block content %}
       {% endblock %}
</main>
<footer class="bg-dark text-white text-center py-3 mt-auto">
<div class="container">
<small>&copy; 2026 Department of Information Technology. DTI412 Web Development.</small>
</div>
</footer>
</body>
</html>
